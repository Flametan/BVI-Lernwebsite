[package]
name = "klausur_app"
version = "0.1.0"
edition = "2021"
description = "Übungsklausuren zum Bearbeiten (IBK, später VAk, FeuAK, IdF)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement", "Storage", "Event", "EventTarget", "Node", "Performance", "DomTokenList", "NodeList"] }

[profile.release]
opt-level = "s"
lto = true
