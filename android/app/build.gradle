plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.bvi.lernwebsite'
    compileSdk 34

    defaultConfig {
        applicationId 'de.bvi.lernwebsite'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName (System.getenv('VERSION_NAME') ?: '1.0')
    }

    // Fester Schlüssel: Nur damit erkennt Android neue Builds als Update der installierten App.
    // Bewusst im Repository (privates Lernprojekt, nicht für den Play Store).
    signingConfigs {
        bvi {
            storeFile file('../bvi.keystore')
            storePassword 'bvi-lernapp'
            keyAlias 'bvi'
            keyPassword 'bvi-lernapp'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.bvi }
        release {
            minifyEnabled false
            signingConfig signingConfigs.bvi
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
