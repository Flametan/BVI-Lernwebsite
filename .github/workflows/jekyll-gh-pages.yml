# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Unique concurrency group per run – prevents stale runs from blocking deploys
concurrency:
  group: "pages-${{ github.run_id }}"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # Nur die veröffentlichte Kopie wird verkleinert (JavaScript und CSS); der Quelltext im Repository bleibt lesbar.
      # Schlägt die Verkleinerung bei einer Datei fehl, bleibt diese Datei unverändert.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Minify JavaScript and CSS
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/esb" esbuild@0.25.0
          ESB="$RUNNER_TEMP/esb/node_modules/.bin/esbuild"
          for f in _site/js/*.js _site/embed/*.js; do
            case "$f" in *.min.js) continue;; esac
            "$ESB" "$f" --minify --charset=utf8 --target=es2019 --allow-overwrite --outfile="$f" --log-level=error || echo "Verkleinern übersprungen: $f"
          done
          "$ESB" _site/css/style.css --minify --charset=utf8 --allow-overwrite --outfile=_site/css/style.css --log-level=error || echo "Verkleinern übersprungen: style.css"
          ls -l _site/js/app.js _site/css/style.css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
