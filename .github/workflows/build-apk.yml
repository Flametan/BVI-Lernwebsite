name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore persistent release keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: bvi-release.jks
          key: bvi-release-keystore-v1

      - name: Generate keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair \
            -alias bvi-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore bvi-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=BVI Lernwebsite,OU=Feuerwehr,O=BVI,L=DE,ST=DE,C=DE" \
            -noprompt

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools and platform
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/bvi-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=bvi-release \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bvi-lernwebsite.apk

      - name: Delete old release and tag (if exists)
        run: gh release delete android-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android App (aktuellste Version)
          prerelease: false
          make_latest: true
          body: |
            **B VI – Höherer Dienst** als Android-App.

            Mindestanforderung: Android 8.0 (API 26)

            Diese APK wird bei jedem Update der Website automatisch neu gebaut.
          files: bvi-lernwebsite.apk
