<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planspiel-Trainer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{--bg:#0d1522;--card:#162132;--soft:#1d2b40;--line:#2a3b57;--ink:#eef2f8;--mute:#9fb0c8;--or:#ffa412;--onor:#241503;--ok:#3ecf8e;--bad:#ff7a6b;--ff:"Segoe UI",system-ui,Arial,sans-serif}
:root[data-theme="light"]{--ok:#157a50;--bad:#b3261e}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select{font-family:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{flex:0 0 auto;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.eb{font-size:12px;color:var(--or);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.top h1{margin:1px 0 0;font-size:20px;line-height:1.2}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.dn{background:color-mix(in srgb,var(--or) 55%,var(--line))}
.steps i.cur{background:var(--or)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.tabs{order:3;flex:0 0 auto;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.tab{flex:1;min-height:50px;border:0;border-radius:14px;background:transparent;color:var(--mute);font:700 12.5px/1.1 inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tab b{font-size:18px;font-weight:400;line-height:1}
.tab.on{background:color-mix(in srgb,var(--or) 16%,transparent);color:var(--or)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.acc{border-color:var(--or)}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
h2{margin:0;font-size:18px;line-height:1.25}
h3{margin:0 0 4px;font-size:15.5px;line-height:1.3}
p{margin:0 0 8px}
p:last-child{margin-bottom:0}
.mu{color:var(--mute)}
.sm{font-size:13.5px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:700 15px/1.2 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 14px;cursor:pointer;width:100%}
.btn.or{background:var(--or);color:var(--onor);border-color:var(--or)}
.btn[disabled]{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:600 14px/1.2 inherit;font-family:inherit;padding:6px 12px;cursor:pointer;text-align:center}
.chip.on{border-color:var(--or);background:color-mix(in srgb,var(--or) 20%,var(--card))}
.chip.ok,.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.chip.bad,.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.chip.sol,.opt.sol{border-style:dashed;border-color:var(--ok)}
.chip[disabled],.opt[disabled]{cursor:default}
.opt{display:block;width:100%;min-height:48px;text-align:left;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:600 14px/1.3 inherit;font-family:inherit;padding:8px 12px;cursor:pointer;margin-top:6px}
.opt.on{border-color:var(--or);background:color-mix(in srgb,var(--or) 20%,var(--card))}
.fb{border-radius:12px;padding:9px 12px;font-size:14px;border:1.5px solid;margin-top:8px}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.fb.nt{border-color:var(--line);background:var(--soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--mute);border:1px solid var(--line);margin-right:6px}
.tag.k{color:var(--ok);border-color:var(--ok)}.tag.u{color:var(--bad);border-color:var(--bad)}
.q{display:block;width:100%;text-align:left;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14.5px/1.3 inherit;font-family:inherit;padding:8px 12px;cursor:pointer}
.q[disabled]{cursor:default}
.q.asked{border-color:var(--or);background:color-mix(in srgb,var(--or) 10%,var(--card))}
.q.dim{opacity:.45}
.ans{margin:6px 0 2px;padding:8px 12px;border-left:4px solid var(--or);background:var(--soft);border-radius:0 10px 10px 0;font-size:14px}
.bud{display:flex;align-items:center;gap:10px}
.bud .bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bud .bar i{display:block;height:100%;background:var(--or)}
.item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.item .t{font-size:14.5px;font-weight:600;margin-bottom:8px}
.sel{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font-size:14px;padding:0 8px}
.sel.ok{border-color:var(--ok)}.sel.bad{border-color:var(--bad)}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fld>span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:40px;font-weight:800;color:var(--or);line-height:1}
.pb{display:grid;grid-template-columns:118px 1fr 52px;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
.pb .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pb .bar i{display:block;height:100%;background:var(--or)}
.pb b{text-align:right}
details{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details>summary{min-height:44px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"+";font-size:20px;color:var(--mute)}
details[open]>summary:after{content:"–"}
details .in{padding:0 14px 12px}
ul.l{margin:0;padding-left:18px}ul.l li{margin:3px 0}
.er{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.er:last-child{border:0}.er b{display:block;color:var(--bad)}
.col3{display:grid;grid-template-columns:1fr;gap:8px}
.col3 .card{padding:8px 12px}
.ln{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.ln b{flex:0 0 78px;color:var(--mute);font-weight:700}
.ln.ok span:last-child{color:var(--ink)}
.mk{font-weight:800}.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}
.sc{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 14px;cursor:pointer;min-height:64px}
.sc:hover{border-color:var(--or)}
.sc b{display:block;font-size:16px}
.sc span{display:block;font-size:13.5px;color:var(--mute);margin-top:2px}
.sc em{font-style:normal;font-size:12.5px;color:var(--or);font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);font-size:12px}
.tw{overflow-x:auto}
.ph{display:flex;gap:10px;align-items:flex-start}
.ph .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--or);color:var(--onor);font-weight:800;display:flex;align-items:center;justify-content:center}
@media(min-width:900px){
 .app{flex-wrap:nowrap}
 .tabs{order:1;border-top:0;border-bottom:1px solid var(--line);justify-content:center;padding:6px 16px}
 .tab{flex:0 0 auto;flex-direction:row;gap:8px;padding:0 22px;min-height:44px;font-size:14px}
 main{order:2}
 .top{order:0}
 .col3{grid-template-columns:1fr 1fr 1fr}
 .wrap{padding:16px 20px 32px}
}
@media(max-width:420px){.pb{grid-template-columns:96px 1fr 48px}.g2{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div>
<script src="embed-sync.js"></script><script src="planspiel.js"></script></body></html>
