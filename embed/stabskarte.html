<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="../css/fonts.css">
<title>Taschenkarte Stabsarbeit</title>
<style>
:root{
  --bg:#f3f2ef;--card:#fff;--ink:#1d1d1b;--mute:#66665f;--line:#e2e0da;--soft:#ecebe6;
  --or:#ffa412;--ord:#c2410c;--orsoft:#fff1d6;--onor:#1d1d1b;
  --c-schwarz:#111;--c-rot:#d6221e;--c-blau:#1b5fc4;--c-gruen:#2e9a46;
  --ok:#2e7d32;--bad:#c62828;--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(30,25,10,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#1f1f1d;--ink:#f1f0ec;--mute:#aeada5;--line:#37362f;--soft:#2a2a27;
  --or:#ffa412;--ord:#ffb547;--orsoft:#3a2a0f;
  --c-schwarz:#f1f0ec;--c-rot:#ff5a52;--c-blau:#5aa9ff;--c-gruen:#46c566;
  --ok:#66bb6a;--bad:#ff7b72;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1f1f1d;--ink:#f1f0ec;--mute:#aeada5;--line:#37362f;--soft:#2a2a27;
  --ord:#ffb547;--orsoft:#3a2a0f;--c-schwarz:#f1f0ec;--c-rot:#ff5a52;--c-blau:#5aa9ff;--c-gruen:#46c566;--ok:#66bb6a;--bad:#ff7b72;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
h1,h2,h3,h4{line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.c-schwarz{color:var(--c-schwarz)}.c-rot{color:var(--c-rot)}.c-blau{color:var(--c-blau)}.c-gruen{color:var(--c-gruen)}
.sg{display:block;width:100%;height:100%;overflow:visible}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Kopf */
.top{background:var(--card);border-top:6px solid var(--or);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:12px}
.mark{flex:none;width:46px;height:46px;border-radius:12px;background:var(--or);display:grid;place-items:center}
.mark svg{width:30px;height:30px}
.top h1{font-size:clamp(20px,5.4vw,28px);font-weight:800;letter-spacing:-.01em}
.top p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tabs .wrap{display:flex;padding:0 8px}
.tab{flex:1 1 0;min-width:0;min-height:52px;background:none;border:0;border-bottom:4px solid transparent;font-weight:700;font-size:14px;color:var(--mute);padding:6px 2px;position:relative}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--or)}
.tab .lg{display:none}
@media(min-width:700px){.tab{font-size:16px}.tab .sh{display:none}.tab .lg{display:inline}}
main{padding:20px 0 56px}
.panel[hidden]{display:none}
.lead{color:var(--mute);margin:0 0 14px;font-size:15px}
.h2{font-size:22px;font-weight:800;margin:26px 0 10px}
.h2:first-child{margin-top:0}
.h2 small{font-weight:500;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--onor)}
.btn:active{transform:scale(.98)}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;max-width:100%;flex-wrap:wrap}
.seg button{min-height:44px;padding:6px 10px;font-size:14px;border:0;background:none;border-radius:11px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callout{border-left:5px solid var(--or);background:var(--orsoft);border-radius:4px 12px 12px 4px;padding:10px 14px;font-weight:600}
.callout.warn{border-color:var(--c-rot)}
.note{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ord);background:var(--orsoft);border-radius:6px;padding:2px 7px}

/* 7-Punkte */
.plan-grid{display:grid;gap:14px}
@media(min-width:900px){.plan-grid{grid-template-columns:1fr 360px;align-items:start}.plan-side{position:sticky;top:70px}}
.ringcard{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:14px}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--soft)}.ring .pr{stroke:var(--or);transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font-size:24px;font-weight:800}
.ring b small{font-size:13px;font-weight:600;color:var(--mute)}
.pcard{display:flex;flex-wrap:wrap;align-items:stretch;margin-bottom:10px;overflow:hidden}
.pcard.done{border-color:var(--or)}
.pc-head{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:12px 8px 12px 14px;min-height:64px}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px}
.pcard.done .num{background:var(--or);color:#1d1d1b}
.pc-head .t{font-weight:800;font-size:17px;flex:1}
.pc-head .chev{flex:none;width:18px;height:18px;transition:transform .2s;color:var(--mute)}
.pc-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.chk{flex:none;width:64px;min-height:64px;border:0;border-left:1px solid var(--line);background:var(--soft);display:grid;place-items:center}
.chk span{width:32px;height:32px;border-radius:9px;border:2.5px solid var(--mute);display:grid;place-items:center;color:transparent;font-weight:900;font-size:19px;background:var(--card)}
.chk[aria-pressed="true"]{background:var(--orsoft)}
.chk[aria-pressed="true"] span{background:var(--or);border-color:var(--or);color:#1d1d1b}
.pc-body{flex-basis:100%;margin:0;padding:0 18px 14px 64px;list-style:none;color:var(--ink)}
.pc-body[hidden]{display:none}
.pc-body li{position:relative;padding:3px 0 3px 16px}
.pc-body li::before{content:"";position:absolute;left:0;top:.8em;width:7px;height:7px;border-radius:2px;background:var(--or)}
.game{padding:16px}
.game h3{font-size:18px;margin-bottom:4px}
.slots{display:grid;gap:6px;margin:10px 0;padding:0;list-style:none;counter-reset:s}
.slots li{min-height:40px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
.slots li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px}
.slots li.ok{border:2px solid var(--or);background:var(--orsoft);font-weight:700}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:48px;text-align:left;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:24px;font-weight:700;margin:6px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* Stab */
.stab-grid{display:grid;gap:16px}
@media(min-width:1000px){.stab-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.stab-det{position:sticky;top:70px}}
.org{padding:16px 12px 18px}
.org-top{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.leiter{background:#b50d0d;color:#fff;font-weight:800;border-radius:10px;padding:12px 22px;font-size:17px;text-align:center;box-shadow:0 4px 10px rgba(150,0,0,.25)}
.beig{background:#f4b183;color:#4a2208;border-radius:999px;font-weight:700;font-size:13px;padding:7px 14px;text-align:center}
.org-trunk{width:2px;height:16px;background:var(--mute);margin:0 auto}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;position:relative;padding-top:6px}
.sgrid::before{content:"";position:absolute;left:25%;right:25%;top:0;height:2px;background:var(--mute)}
@media(min-width:560px){.sgrid{grid-template-columns:repeat(6,1fr)}.sgrid::before{left:calc(100%/12);right:calc(100%/12)}}
.sbox{position:relative;border:0;border-radius:12px;padding:10px 6px 10px;min-height:96px;text-align:center;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:center;gap:2px}
.sbox::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:var(--mute)}
.sbox .code{font-size:26px;font-weight:800;line-height:1}
.sbox .nm{font-size:12.5px;line-height:1.2;font-style:italic}
.sbox[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.sbox.rel{outline:3px dashed var(--ink);outline-offset:2px}
.sbox.rel::after{content:"verknüpft";position:absolute;right:4px;top:3px;font-size:10px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px}
.det{padding:16px}
.det-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.det-h .code{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.grp{margin:14px 0 0}
.grp h4{color:var(--ord);font-size:16px;margin-bottom:4px}
.grp ul{margin:0;padding:0;list-style:none}
.grp li{position:relative;padding:3px 0 3px 18px}
.grp li::before{content:"";position:absolute;left:2px;top:.85em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.grp li .lnk{color:var(--ord);font-weight:800}
.grp .empty{color:var(--mute);font-size:14px;font-style:italic}
.net svg{width:100%;height:auto;display:block}
.net .nd{cursor:pointer}
.net .nd rect{stroke:var(--card);stroke-width:2}
.net .nd:focus-visible rect{stroke:var(--ink);stroke-width:3}
.net .ed{stroke:var(--mute);stroke-width:2.2;stroke-dasharray:5 4;fill:none}
.net .ed.on{stroke:var(--ord);stroke-width:3.6;stroke-dasharray:none}
.net text{font-family:inherit}
.dep-list{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.dep-list li{display:flex;gap:10px;font-size:14px}
.dep-list b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ord);color:var(--card);display:grid;place-items:center;font-size:13px}

/* Zeichen */
.legend{display:grid;gap:8px;padding:14px;margin-bottom:14px}
@media(min-width:700px){.legend{grid-template-columns:repeat(4,1fr)}}
.lg-i{display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:56px}
.lg-i[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.lg-i i{flex:none;width:22px;height:22px;border-radius:50%;margin-top:2px;background:currentColor}
.lg-i span{font-size:13px;color:var(--ink);line-height:1.35}
.lg-i b{display:block;font-size:15px}
.search{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:8px 14px;margin-bottom:8px}
.sgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.sgrid2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.zc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 12px;min-height:120px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.zc .ico{width:100%;height:58px}
.zc .nm{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.zc:hover{border-color:var(--or)}
.gh{font-size:15px;font-weight:800;margin:18px 0 8px;color:var(--ord)}
dialog{border:0;border-radius:20px;padding:0;max-width:min(440px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:20px;text-align:center}
.dlg .big{width:200px;height:150px;margin:0 auto 8px}
.dlg .four{display:flex;justify-content:center;gap:10px;margin:12px 0}
.dlg .four div{width:64px;height:48px}
.dlg h3{font-size:20px}
.field{display:grid;gap:4px;font-weight:600;font-size:14px}
.field input,.field select{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:6px 10px;width:100%}
.form{display:grid;gap:12px}
@media(min-width:700px){.form.c2{grid-template-columns:1fr 1fr}.form.c4{grid-template-columns:repeat(4,1fr)}}
.bigout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(22px,7vw,34px);font-weight:800;letter-spacing:.02em;padding:12px;border-radius:12px;background:var(--soft);text-align:center;overflow-wrap:anywhere}
.build-grid{display:grid;gap:14px}
@media(min-width:900px){.build-grid{grid-template-columns:1fr 1fr;align-items:start}}
.qbig{width:min(260px,70%);height:150px;margin:6px auto 12px}
.qbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:10px}
.qbar i{display:block;height:100%;background:var(--or);transition:width .3s}
.qopts{display:grid;gap:8px}
@media(min-width:700px){.qopts.two{grid-template-columns:1fr 1fr}}
.qopt-sign{height:84px;display:grid;place-items:center;padding:6px}

/* Lager */
.sum-grid{display:grid;gap:12px}
@media(min-width:700px){.sum-grid{grid-template-columns:repeat(3,1fr)}}
.sum{padding:14px}
.sum h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--ord);margin-bottom:6px}
.sum ul{margin:0;padding-left:18px}
.sum.span{grid-column:1/-1}
.sum big{display:block;font-size:30px;font-weight:800;line-height:1.1}
.banner{display:flex;gap:12px;align-items:center;background:var(--c-rot);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;margin:14px 0}
.banner svg{flex:none;width:34px;height:34px}
.flow{display:grid;gap:0;margin:0;padding:0;list-style:none}
@media(min-width:900px){.flow{grid-template-columns:repeat(5,1fr);gap:0}}
.fl{position:relative;padding:14px 12px 14px 12px;text-align:center}
.fl .bub{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:var(--or);color:#1d1d1b;display:grid;place-items:center}
.fl .bub svg{width:30px;height:30px}
.fl b{display:block;font-size:15px}
.fl span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.fl::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;border-right:3px solid var(--or);border-bottom:3px solid var(--or);transform:translateX(-50%) rotate(45deg)}
.fl:last-child::after{display:none}
@media(min-width:900px){.fl::after{left:auto;right:-8px;top:36px;bottom:auto;transform:rotate(-45deg)}}
.cost{display:grid;gap:10px;align-items:stretch}
@media(min-width:800px){.cost{grid-template-columns:1fr auto 1fr}}
.cbox{padding:14px;border-radius:14px;border:2px solid var(--line)}
.cbox h4{font-size:16px;margin-bottom:6px}
.cbox ul{margin:0;padding-left:18px}
.cbox.land{border-color:var(--c-blau)}.cbox.anf{border-color:var(--or);background:var(--orsoft)}
.carrow{display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;color:var(--mute);padding:4px}
.carrow svg{width:150px;height:70px}
.kat-grid{display:grid;gap:12px}
@media(min-width:800px){.kat-grid{grid-template-columns:1fr 1fr}}
.kg{padding:14px}
.kg-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.kg-h .n{flex:none;background:var(--or);color:#1d1d1b;font-weight:800;border-radius:8px;padding:2px 8px;font-size:15px}
.kg-h h4{font-size:16px;flex:1}
.stock{font-size:12px;font-weight:700;color:var(--mute);background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pos{list-style:none;margin:0;padding:0;font-size:14px}
.pos li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.pos li b{flex:none;font-weight:700;text-align:right}
.pos em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.je{margin:0;font-size:14px}
.kg .add{margin-top:10px;width:100%}
.calc-grid{display:grid;gap:14px}
@media(min-width:900px){.calc-grid{grid-template-columns:1.1fr 1fr;align-items:start}.calc-out{position:sticky;top:70px}}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.crow .lbl{flex:1;min-width:0;font-size:15px}
.crow .lbl small{display:block;color:var(--mute);font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;line-height:1}
.step output{display:inline-block;min-width:34px;text-align:center;font-weight:800;font-size:18px}
.crow.on .lbl{font-weight:700}
.sch{font-weight:800;margin:14px 0 2px;color:var(--ord)}
.out{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);padding:12px;font-size:15px;line-height:1.55;resize:vertical}

/* EVA */
.sit{display:grid;gap:12px}
@media(min-width:900px){.sit{grid-template-columns:1fr 1fr}.sit .full{grid-column:1/-1}}
.sit .card{padding:14px;border-top:5px solid var(--c-schwarz)}
.sit .card.rot{border-top-color:var(--c-rot)}.sit .card.blau{border-top-color:var(--c-blau)}
.sit h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.sit p{margin:0}
.sketch{padding:8px;margin:14px 0}
.sketch>svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.sk-t{font:600 11px "Segoe UI",system-ui,sans-serif;fill:var(--ink)}
.stepper{display:flex;gap:8px;margin:0 0 12px}
.stepper button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px}
.stepper button[aria-selected="true"]{border-color:var(--or);background:var(--orsoft)}
.stepper .dot{width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px}
.stepper .dot.d{background:var(--or);color:#1d1d1b}
.stepper .tl{display:none}
@media(min-width:600px){.stepper .tl{display:inline}}
.task{padding:16px}
.task h3{font-size:20px;margin-bottom:8px}
.task ol{padding-left:0;list-style:none;margin:8px 0}
.task ol li{margin:8px 0}
.task textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;resize:vertical;margin-top:4px}
.hint{border:1.5px dashed var(--ord);border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--orsoft)}
.hint ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
footer{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Einbettung in die B-VI-App (iframe, ?embed=1): Kopf und Fuß entfallen, Farben kommen aus der App */
html.emb .top,html.emb footer{display:none}
html.emb body{background:var(--bg);font-family:var(--ff,inherit)}
html.emb .tabs{box-shadow:none}
html.emb main{padding-top:14px}
/* Lagerhalle im Querschnitt */
.hall{padding:8px}.hall svg{display:block;width:100%;height:auto}
.hall .pal{cursor:pointer}
.hall .pal .ring{fill:none;stroke:var(--or);stroke-width:3;opacity:0}
.hall .pal[aria-pressed="true"] .ring,.hall .pal:focus-visible .ring{opacity:1}
.hall .pal:focus-visible{outline:none}
.hall .pal.dim{opacity:.25}
.hall .pal:hover .pbox{filter:brightness(1.12)}
.hall .cnt circle{fill:var(--ink)}.hall .cnt text{fill:var(--card);font-weight:800;font-size:11px;text-anchor:middle}
.hdet h4{font-size:17px;margin:8px 0 6px}
.hdet .scn{display:inline-block;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.hdet .hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hdet .hnum{min-width:34px;text-align:center;font-weight:800;font-size:18px}
/* Musterlösung */
.ml{margin-top:14px;border:2px solid var(--or);border-radius:14px;background:var(--card);overflow:hidden}
.ml>summary{cursor:pointer;list-style:none;min-height:48px;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:10px}
.ml>summary::-webkit-details-marker{display:none}
.ml>summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--ord)}
.ml[open]>summary::after{content:"−"}
.ml .mlb{padding:4px 16px 16px;font-size:15px}
.ml h4{font-size:15px;margin:14px 0 4px;color:var(--ord)}
.ml ul{margin:4px 0 4px 20px;padding:0}.ml li{margin:3px 0}
.ml .q{font-size:12.5px;color:var(--mute);margin-top:12px}
.ml .warn2{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:8px 0}
</style>

  const cost=`<div class="cost"><div class="cbox land"><h4>Das Land NRW trägt</h4><ul><li>die Anmietung der Lagerflächen</li><li>die Beschaffung der Erstausstattung</li><li>den Unterhalt</li></ul></div><div class="carrow">${arrow}<span>Übergabe: Eigentum geht über.<br>Rückgabe nicht möglich.</span></div><div class="cbox anf"><h4>Die anfordernde Stelle</h4><ul><li>ist nach der Übergabe Eigentümer der Einsatzmittel</li><li>trägt die Kosten der Ersatzbeschaffung</li></ul></div></div>`;

  const cat=KSL.katalog.filter(s=>kScen==='all'||s.nr===kScen).map(s=>`<h3 class="sch">${s.nr}. ${esc(s.szenario)}</h3><div class="kat-grid">${s.gruppen.map(g=>`<div class="card kg"><div class="kg-h"><span class="n">${g.nr}</span><h4>${esc(g.name)}</h4>${g.paletten!=null?`<span class="stock">${g.paletten} Paletten im Lager</span>`:''}</div>${positionsHtml(g)}<button class="btn add" data-act="kadd" data-nr="${g.nr}">Zum Ersuchen: ${g.paletten!=null?'+1 Palette':'+1 Stück'}${kSel[g.nr]?' (jetzt '+kSel[g.nr]+')':''}</button></div>`).join('')}</div>`).join('');
  const rows=KSL.katalog.map(s=>`<div class="sch">${s.nr}. ${esc(s.szenario)}</div>`+s.gruppen.map(g=>{const n=kSel[g.nr]||0;return `<div class="crow ${n?'on':''}"><div class="lbl">${g.nr} ${esc(g.name.replace(/ – .*$/,''))}<small>${g.paletten!=null?'ganze Paletten, höchstens '+g.paletten:'Merkblatt nennt hier nur Stück, höchstens 10'}</small></div><div class="step"><button data-act="kminus" data-nr="${g.nr}" aria-label="${esc(g.name)}: eine ${kUnit(g)} weniger" ${n?'':'disabled'}>−</button><output aria-label="Anzahl ${esc(g.name)}">${n}</output><button data-act="kplus" data-nr="${g.nr}" aria-label="${esc(g.name)}: eine ${kUnit(g)} mehr" ${n>=kMax(g)?'disabled':''}>+</button></div></div>`}).join('')).join('');
  const txt=ersuchenText(kSel,kLage,kTr);

   <div class="calc-out"><div class="card pad"><h3 style="font-size:18px;margin-bottom:8px">Ersuchen in der Sofortmeldung</h3>
    <label class="field" style="margin-bottom:10px">Lage (nur für den Satzanfang)<input id="klage" type="text" maxlength="60" value="${esc(kLage)}"></label>
    <div class="seg" role="group" aria-label="Transport" style="margin-bottom:10px"><button data-act="ktr" data-v="eigene" aria-pressed="${kTr==='eigene'}">Eigene Kräfte</button><button data-act="ktr" data-v="bezreg" aria-pressed="${kTr==='bezreg'}">Bezirksregierung</button></div>
    <textarea class="out" id="kout" readonly aria-label="Text für das Ersuchen" placeholder="Wähle links Paletten aus. Der Text für das Ersuchen entsteht hier.">${esc(txt)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="kcopy" ${txt?'':'disabled'}>Text kopieren</button><button class="btn" data-act="kreset">Auswahl leeren</button><span class="note" id="kmsg" aria-live="polite">${esc(kMsg)}</span></div>
    <div class="callout warn" style="margin-top:12px">Betriebsmittel sind selbst zu stellen! Eine eigene Logistik muss parallel aufgebaut werden.</div></div></div></div>`;
  $('#panel-lager').innerHTML=`<h2 class="h2">Katastrophenschutzlager NRW</h2><p class="lead">${esc(KSL.ziel[0])}. ${esc(KSL.ziel[1])}.</p>
   <div class="banner"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3L28 26H2z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M15 11v7M15 21.5v.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><span>Betriebsmittel selbst stellen! Nur vollständige Paletten, keine einzelnen Bestandteile.</span></div>
   <div class="sum-grid">${sum}</div>
   <h2 class="h2">Anforderungsweg</h2>${flow}
   <h2 class="h2">Kosten und Eigentum</h2>${cost}
   <h2 class="h2">Die Lagerhalle im Querschnitt</h2><p class="lead">Vier Regalspalten, eine je Szenario. Palette antippen: Inhalt ansehen und in den Anforderungsrechner legen.</p><div class="card hall">${hallSvg()}</div><div class="card pad hdet" id="halldet" style="margin-top:12px">${hallDet()}</div>
   <h2 class="h2">Katalog nach Szenarien</h2><p class="lead">${esc(KSL.hinweisPaletten)}</p><div class="chips" role="group" aria-label="Szenario">${scens.map(s=>`<button class="chip" data-act="kscen" data-s="${s[0]}" aria-pressed="${kScen===s[0]}">${esc(s[1])}</button>`).join('')}</div>${cat}
   <h2 class="h2" id="rechner">Anforderungsrechner</h2>${calc}`;
}

  const sy=window.scrollY;
  if(a==='kscen')kScen=b.dataset.s;
  else if(a==='hall'){hSel=nr;if(!kSel[nr]){kSel[nr]=1;lsSet('bvi_stk_lager_sel',kSel);}kMsg='';}
  else if(a==='kplus'||a==='kadd'){kSel[nr]=Math.min(kMax(g),(kSel[nr]||0)+1);lsSet('bvi_stk_lager_sel',kSel);kMsg='';}
  else if(a==='kminus'){kSel[nr]=Math.max(0,(kSel[nr]||0)-1);if(!kSel[nr])delete kSel[nr];lsSet('bvi_stk_lager_sel',kSel);kMsg='';}
  else if(a==='ktr'){kTr=b.dataset.v;lsSet('bvi_stk_lager_tr',kTr);kMsg='';}

  renderLager();window.scrollTo(0,sy);
  const t=$(`#panel-lager [data-act="${a==='kadd'?'kadd':a}"]${nr?`[data-nr="${nr}"]`:''}${b.dataset.v?`[data-v="${b.dataset.v}"]`:''}${b.dataset.s?`[data-s="${b.dataset.s}"]`:''}`);if(t&&!t.disabled)t.focus({preventScroll:true});
});

const ML={
1:{lead:'Lage: Trümmersuche nach Gasexplosion, Einsturzgefahr, Schwerpunkt des Stabes. Der Eigenschutz hat drei Komponenten (K2-140, 3.8). Der Umfang folgt der Lagebewertung im Sachgebiet 4.',
 teile:[
 ['a) Umfang festlegen',['<b>Medizinisch:</b> Die Verletzten sind weitgehend versorgt, der EA Medizin (MANV 20) ist vor Ort. Verletzte Einsatzkräfte können direkt in die MANV-Struktur übergeben werden. Ergänzend sinnvoll: 1 RTW + 1 NEF oder eine Teileinheit Sanitätsdienst, nur für Einsatzkräfte reserviert, nahe der Einsatzstelle.','<b>Technisch:</b> Trümmer, Nachsturz, Gasreste. Sinnvoll ist ein einsatzbereiter technischer Rettungstrupp für die Rettung eigener Kräfte, zum Beispiel 1 Technischer Zug oder Teile davon mit Bergungs- und Stützmitteln. Er darf nicht in der Suche gebunden sein.','<b>Psychosozial:</b> Die Suche nach Vermissten, vermutlich ohne Erfolg, belastet. Fachberater PSNV-E aktivieren, Gesprächsangebote während der Ablösung und nach Einsatzende.','Unkritische Lagen können ohne Eigenschutz auskommen; hier ist die Gefährdung hoch, deshalb voller Umfang.']],
 ['b) Abstimmung',['<b>Leiter des Stabes bzw. Einsatzleiter:</b> Freigabe von Umfang und Kräften.','<b>EA Gebäude:</b> Gefährdung, Trümmerlage, Einsatzdauer und Ablösung.','<b>EA Medizin / Leiter Rettungsdienst:</b> Mittel nicht doppelt binden, MANV-Übergabe.','<b>S2/S3 und S6:</b> Kräfte und Funk. <b>Fachberater PSNV-E</b> und gegebenenfalls Sicherheitsbeauftragter.']],
 ['c) Eine Minute zwischen „Mayday“ und „Beginn Rettung“',['Standort, Umfang und Erreichbarkeit des Eigenschutzes allen Abschnitten mitteilen. Aktivierung <b>nach eigenem Ermessen</b> freigeben, ohne Umweg über den Stab (K2-140: lange Meldewege vermeiden).','Eigenschutz <b>an der Einsatzstelle</b> in Sichtweite oder Funkweite des EA Gebäude positionieren, eigener Funkkanal oder Mithören des Abschnittskanals, Notfallstichwort „Mayday“ vorab vereinbaren.','Alternative: Eigenschutz <b>abschnittsweise</b> im EA Gebäude bilden (wie ein Sicherheitstrupp nach FwDV 7), mit Auftrag „Rettung eigener Kräfte“. Ausgerüstet und in Bereitstellung, nicht mit Aufgaben belegt.']],
 ['d) Nicht als normale Verstärkung einsetzen',['Klarer Auftrag und Kennzeichnung: „Eigenschutz, nur Rettung eigener Kräfte“. Im Einsatztagebuch und auf der Lagekarte als gesperrte Reserve führen.','Im Führungsstab festlegen: Zugriff nur durch Einsatzleiter oder S4 auf Anforderung. Alle Abschnittsführer und Leitstelle sind informiert.','Ersatz für eingesetzte Kräfte aus anderen Reserven; wird der Eigenschutz doch belegt, sofort ersetzen (Nachforderung). Ablösung des Eigenschutzes selbst vorplanen.']]],
 qu:'Lernunterlage K2-140 „Sachgebiet Versorgung“, Abschnitt 3.8; FwDV 7 (Sicherheitstrupp als Merkhilfe).'},
2:{lead:'Ziel: 100 Einsatzkräfte erhalten am späten Nachmittag (ca. 17–18 Uhr) eine warme Mahlzeit. Es gibt keine Vorplanung. Aufträge folgen „Führen mit Auftrag“: Portionen, Ort, Uhrzeit, Ansprechpartner vorgeben, die Menge muss nicht berechnet werden (K2-140, 3.1).',
 teile:[
 ['Option A: Einsatzeinheit Betreuung NRW mit Verpflegungsmodul',['Über Bezirksregierung bzw. Kreisleitstelle anfordern. Das Verpflegungsmodul ist auf 250 Portionen ausgelegt, mittlere Autarkie. Die Teileinheit Betreuung kann modular alarmiert werden.','<b>Vorteil:</b> Landeseinheitlich, Hygiene und Zubereitung aus einer Hand. <b>Nachteil:</b> Vorlauf und Anfahrt, geeigneter Ort mit befestigter Fläche sowie Trink- und Abwassernetz nötig. Für nur 100 Portionen überdimensioniert.']],
 ['Option B: THW Fachgruppe Logistik-Verpflegung oder Logistikzug NRW',['FGr Log-V verpflegt etwa 250 Personen, Logistikzug NRW 175. Beide bringen Zubereitung, teils Zelte und Material mit.','<b>Vorteil:</b> Ortsfeste THW-Küchen im Umfeld nutzbar, hohe Durchhaltefähigkeit bis 22 Uhr und darüber hinaus. <b>Nachteil:</b> Anforderung über Amtshilfe/Stabsweg, Vorlaufzeit.']],
 ['Option C: Caterer oder Großküche vor Ort',['Kostenübernahmeerklärung des Stabes (E-Mail genügt oft), Lieferung in Thermoboxen an die Einsatzstelle. Ausgabe durch eine Kraft der Feuerwehr oder des Katastrophenschutzes.','<b>Vorteil:</b> Meist am schnellsten bei kurzer Vorlaufzeit, genaue Portionszahl, keine Fahrzeuge blockiert. <b>Nachteil:</b> Hygiene und Qualität liegen beim Unternehmer, Kosten, Abhängigkeit vom Anbieter.']],
 ['Empfehlung',['<b>Option C</b> als Sofortlösung für die Mahlzeit um 17–18 Uhr, parallel <b>Option A</b> (nur Teileinheit Betreuung) als Absicherung für längeren Einsatz. Begründung: Zeitfenster bis zum späten Nachmittag, nur 100 Portionen, keine Vorplanung. Ein Caterer liefert ohne großen Aufbau; die Einheit sichert Dauerbetrieb und Ersatz, falls der Einsatz länger dauert als bis 22 Uhr.','Rahmenbedingungen im Auftrag: 100 Portionen, Ausgabeort (nah an der Einsatzstelle, aber außerhalb der Gefahrenzone, mit Waschmöglichkeit für Hände und Gesicht und Ablegen der Schutzkleidung), Uhrzeit, Ansprechpartner, Kommunikationsweg. Dazu Kaltgetränke: 5 Liter je 12 Stunden für körperlich Arbeitende, 2 Liter für nicht körperlich Arbeitende. Keine Alkoholabgabe. Kostenfreigabe vorab beim Leiter des Stabes holen.']]],
 qu:'Lernunterlage K2-140, Abschnitte 2.3–2.5 (Einsatzeinheit NRW, Logistikzug, THW) und 3.1 Verpflegung.'},
3:{lead:'Wichtig: Kostenträger ist auch in Großschadenslagen die örtlich zuständige Gemeinde (§ 50 Abs. 2 BHKG). Die Einsatzleitung geht meist in Vorleistung; geklärt wird erst im Nachgang. Haushalts- und Vergaberecht gelten weiter (K2-140, 3.7).',
 teile:[
 ['Sofort tun',['<b>Dienstweg einhalten:</b> Beim Leiter des Stabes bzw. Einsatzleiter nachträglich die <b>Kostenfreigabe</b> einholen und den bisherigen Stand nennen. Bei höheren Summen den Kontakt zum Stab für außergewöhnliche Ereignisse, Krisenstab, Dezernat oder Hauptverwaltungsbeamten herstellen.','<b>Kostenübersicht führen:</b> Alle gebundenen und ausgegebenen Mittel auflisten (Eigenschutz, Getränke, Warmverpflegung, Kraftstoff, Mobiltoiletten), mit Menge, Lieferant, Preis. Meldung an den Stab, bevor die freigegebene Grenze erreicht ist. Andere Sachgebiete verursachen ebenfalls Kosten, deshalb eine Person im Stab, die die Gesamtsumme führt.','<b>Zahlungsweg klären:</b> Kostenübernahmeerklärung (formlos, per E-Mail, vom Stab oder der Verwaltung) für Lieferanten; bei Sofortzahlung Nebenkasse, Karte oder Scheck, Rufbereitschaft der Kämmerei.']],
 ['Kosten begrenzen',['Haushaltsgrundsätze Notwendigkeit, Sparsamkeit und Wirtschaftlichkeit gegen Fürsorgepflicht und Einsatzerfolg abwägen. Teurere Lösungen nur, wenn die Lage es erfordert (zum Beispiel Kraftstoff an der Raststätte statt in der Stadt: bei 10.000 Litern 4.000 Euro Mehrkosten).','Wenn möglich Leistungen der Hilfsorganisationen und des THW nutzen, die in Vorleistung gehen und später abrechnen. Nachbestellungen mit Stab abstimmen.']],
 ['Dokumentation',['Alle Entscheidungen und Freigaben mit Zeit und Person ins Einsatztagebuch. Zum Einsatzende die Kostendokumentation vollständig übergeben, damit die Stadtverwaltung abrechnen kann.','Erweiterung bei Amtshilfe: anfordernde Stelle direkt als Rechnungsadressat angeben.']]],
 qu:'Lernunterlage K2-140, Abschnitt 3.7 Finanzen; § 50 Abs. 2 BHKG (Kostenträger Gemeinde).'}
};
function mlHtml(nr){const m=ML[nr];if(!m)return '';return `<details class="ml"><summary>Musterlösung zu Aufgabe ${nr}</summary><div class="mlb"><p>${esc(m.lead)}</p>${m.teile.map(t=>`<h4>${esc(t[0])}</h4><ul>${t[1].map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}<div class="warn2">Vorschlag aus den Unterlagen und dem Fachwissen abgeleitet. Es gibt keine amtliche Lösung, es gelten immer die örtlichen Vorgaben.</div><p class="q">Quellen: ${esc(m.qu)}</p></div></details>`;}
function renderEva(){
  const S=EVA.szenario;
  const sit=`<div class="sit"><div class="card pad" style="grid-column:1/-1"><h3>Allgemeine Lage</h3><p>${esc(S.allgemeineLage)}</p></div><div class="card pad rot"><h3 style="color:var(--c-rot)">Gefahrenlage</h3><p>${esc(S.gefahrenlage.replace(' (siehe Foto)',''))}</p></div><div class="card pad blau"><h3 style="color:var(--c-blau)">Eigene Lage</h3><p>${esc(S.eigeneLage)}</p></div><div class="card pad" style="grid-column:1/-1;border-top-color:var(--or)"><h3 style="color:var(--ord)">Deine Rolle</h3><p>${esc(S.rolle)}</p><p class="note" style="margin-top:6px">Hilfsmittel: ${esc(EVA.hilfsmittel)}</p></div></div>`;
  const sk=`<div class="card sketch">${lageskizze()}</div><p class="note">Eigene Lageskizze aus taktischen Zeichen, nicht maßstäblich. Rot: Gefahrenlage, Blau: eigene Lage (Kräfte, EA-Grenzen), Schwarz: Gebäude und Straße.</p>`;
  const A=EVA.aufgaben,t=A[evaStep],k='a'+t.nr;
  const stepper=`<div class="stepper" role="tablist" aria-label="Aufgaben">${A.map((a,i)=>`<button role="tab" aria-selected="${i===evaStep}" data-act="estep" data-i="${i}"><span class="dot ${evaDone.includes(a.nr)?'d':''}">${evaDone.includes(a.nr)?'✓':a.nr}</span><span class="tl">${esc(a.titel)}</span></button>`).join('')}</div>`;
  const parts=evaParts(t.text);
  let fields,intro='';
  if(t.nr===1){fields=parts.map((p,i)=>{const lt='abcd'[i];return `<li><label for="n-${k}-${lt}"><b>${esc(p)}</b></label><textarea id="n-${k}-${lt}" data-nk="${k}${lt}" placeholder="Deine Notizen zu ${lt})">${esc(notes[k+lt]||'')}</textarea></li>`}).join('');fields=`<ol>${fields}</ol>`;}
  else fields=`<p>${esc(t.text)}</p><label for="n-${k}" class="note">Deine Notizen</label><textarea id="n-${k}" data-nk="${k}" placeholder="Deine Gedanken, Optionen, Begründung …">${esc(notes[k]||'')}</textarea>`;
  const hints=`<div class="hint"><span class="tag">Gedankenstütze aus den Unterlagen</span><ul>${EVA_HINTS[t.nr].map(h=>`<li><b>${esc(h[0])}:</b> ${esc(h[1])}</li>`).join('')}</ul></div>`;
  const task=`<div class="card task"><h3>Aufgabe ${t.nr}: ${esc(t.titel)}</h3>${fields}${hints}<div class="row"><label class="row" style="gap:8px;min-height:44px"><input type="checkbox" data-act="edone" ${evaDone.includes(t.nr)?'checked':''} style="width:24px;height:24px;accent-color:var(--or)"> Aufgabe bearbeitet</label><span class="sp"></span><button class="btn" data-act="eprev" ${evaStep===0?'disabled':''}>Zurück</button><button class="btn pri" data-act="enext" ${evaStep===A.length-1?'disabled':''}>Weiter</button></div>${mlHtml(t.nr)}</div>`;
  $('#panel-eva').innerHTML=`<h2 class="h2">${esc(EVA.titel)}</h2><p class="lead">${esc(EVA.modul)}</p>${sit}<h2 class="h2">Lageskizze</h2>${sk}<h2 class="h2">Aufgaben</h2>${stepper}${task}<div class="callout" style="margin-top:14px">${esc(EVA.hinweis)}</div><p class="row" style="margin-top:12px"><button class="btn" data-act="eclear">Alle Notizen leeren</button><span class="note" id="emsg" aria-live="polite"></span></p><p class="note">Notizen werden nur in diesem Browser gespeichert.</p>`;
}
const pe=$('#panel-eva');
pe.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='estep')evaStep=+b.dataset.i;else if(a==='eprev')evaStep=Math.max(0,evaStep-1);else if(a==='enext')evaStep=Math.min(2,evaStep+1);
  else if(a==='eclear'){notes={};evaDone=[];lsDel('bvi_stk_eva_notes');lsDel('bvi_stk_eva_done');renderEva();$('#emsg').textContent='Notizen geleert.';return;}
  else return;
  renderEva();const t=$(`#panel-eva [data-act="${a}"]${b.dataset.i?`[data-i="${b.dataset.i}"]`:''}`);if(t&&!t.disabled)t.focus();
});
pe.addEventListener('change',e=>{if(e.target.dataset.act==='edone'){const n=EVA.aufgaben[evaStep].nr;evaDone=e.target.checked?evaDone.concat(n):evaDone.filter(x=>x!==n);lsSet('bvi_stk_eva_done',evaDone);renderEva();$('#panel-eva [data-act="edone"]').focus();}});
pe.addEventListener('input',e=>{const k=e.target.dataset.nk;if(k){notes[k]=e.target.value;lsSet('bvi_stk_eva_notes',notes);}});
renderEva();

showTab((location.hash||'').slice(1)&&TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'plan');
})();
</script>
</body>
